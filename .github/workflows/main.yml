name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish Web Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Validate release version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          manifest_version="$(node -p "require('./public/manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$manifest_version" || "$package_version" != "$manifest_version" ]]; then
            echo "::error::Tag ($GITHUB_REF_NAME), manifest ($manifest_version), and package ($package_version) versions must match."
            exit 1
          fi

      # Always keep the build downloadable.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.ref_name }}
          path: dist/build.zip

      - name: Authenticate to Google Cloud
        id: google-auth
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: google-github-actions/auth@v3
        with:
          project_id: doomscroll-blocker
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      # Upload tag releases as drafts in the Developer Dashboard.
      - name: Upload to Chrome Web Store
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/upload-chrome-web-store.mjs dist/build.zip
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}

      # Create the GitHub release only after the store upload succeeds.
      - name: Create release and attach build
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          files: dist/build.zip
          generate_release_notes: true
